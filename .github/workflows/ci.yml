name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'nix/**', 'kernel/**', 'init/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Build kernels
        run: nix build .#kernel-minimal .#kernel-sandbox .#kernel-disk --print-build-logs --no-link
      - name: Build images
        run: |
          nix build .#example-minimal --out-link result-example
          nix build .#example-minimal-debug --out-link result-example-debug
      - name: Rebuild and compare
        run: for t in kernel-minimal busybox initramfs-prod example-minimal; do nix build .#$t --rebuild --no-link; done
      - name: Boot under QEMU
        run: |
          sudo apt-get install -y -q qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm || true
          scripts/qemu-http.sh result-example
          scripts/qemu-boot.sh result-example-debug
      - name: Collect
        run: |
          mkdir -p out
          cp result-example/image.efi out/snpbase-example-minimal.efi
          cp result-example/reference-values.json out/snpbase-example-minimal.reference-values.json
          cp result-example-debug/image.efi out/snpbase-example-minimal-debug.efi
          cp result-example-debug/reference-values.json out/snpbase-example-minimal-debug.reference-values.json
          for p in minimal sandbox disk; do cp "$(nix build .#kernel-$p --no-link --print-out-paths)/bzImage" out/kernel-$p.bzImage; done
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: snpbase-${{ github.sha }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snpbase-${{ github.sha }}
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            UKIs, Reference Values and kernels for this tag. `SHA256SUMS` lists every file.
            The debug image carries no ssh key; build one with `scripts/build-debug.sh`.
            The Reference Values carry layer hashes but no launch measurements; pass the provider's firmware as `ovmf` to `mkImage`.
